name: pipeline-build-artifact-url
display_name: 获取流水线构建产物下载链接
display_name_en: Get Pipeline Build Artifact Download URL
description: 在蓝盾（BK-CI、devops）流水线中定位最近一次、最近一次成功或指定构建号的构建，确认构建成功后列出产物，并生成临时下载链接。只读，不触发构建。用户想拿流水线打出来的包或文件时使用，例如“拿一下最新构建的包”“流水线产物下载地址”“第 128 次构建的安装包”“把 my-game 最近一次成功的 apk 链接发我”，即使没有提到“蓝盾”或“产物”也应使用。
tags:
- 蓝盾
- devops
- 流水线
- 构建产物
version: 1.0.0
changelog: 首个官方版本：v4_user_build_list → v4_user_build_status → v4_user_artifactory_list → user_artifactory_thirdPartyDownloadUrl。
orchestration:
  description: locate-build 得到构建 ID（`data.records[0].id`），后续接口都用它；所有接口的 `projectId` 相同。只有构建状态为 SUCCEED 才进入 fetch-artifacts。
  inputs:
  - name: project_id
    type: string
    required: true
    description: 蓝盾项目英文名
    example: my-game
  - name: pipeline_id
    type: string
    required: true
    description: 流水线 ID，形如 `p-` 开头的 32 位字符串
    example: p-4b3a4baf5472466aa575973da87505b4
  - name: build_num
    type: integer
    required: false
    description: 构建号；不传则取最近一次构建
    example: 128
  - name: build_status
    type: array
    required: false
    description: 只在这些构建状态中找。用户说“最近一次成功的”时传 `["SUCCEED"]`；指定了构建号时不传
    example:
    - SUCCEED
  - name: ttl
    type: integer
    required: false
    description: 下载链接有效期，秒
    example: 3600
    default: 3600
  outputs:
  - name: build_id
    type: string
    description: 构建 ID
    from: locate-build.v4_user_build_list.data.records[0].id
  - name: build_num
    type: integer
    description: 构建号
    from: locate-build.v4_user_build_list.data.records[0].buildNum
  - name: build_status
    type: string
    description: 构建状态
    from: check-build.v4_user_build_status.data.status
  - name: artifacts
    type: array
    description: 产物列表：文件名、大小、路径、仓库类型
    from: fetch-artifacts.v4_user_artifactory_list.data.records
  - name: download_urls
    type: array
    description: 每个可下载产物的临时下载地址，与跳过文件夹、IMAGE、REPORT 后的 artifacts 一一对应
    from: fetch-artifacts.user_artifactory_thirdPartyDownloadUrl.data
  steps:
  - name: locate-build
    description: 查构建历史，只取一条：不传 `updateTimeDesc` 时按构建号降序，第一条就是符合条件的最近一次构建。给了 `build_num` 时 `buildNoStart`、`buildNoEnd` 都传它；没给则都不传。`data.records`
      为空时停止。`data.hasDownloadPermission` 为 false 时停止，告诉用户没有该流水线的下载权限，后面的接口也拿不到可用地址。
    calls:
    - gateway: devops
      stage: prod
      resource: v4_user_build_list
      params:
        projectId: inputs.project_id
        pipelineId: inputs.pipeline_id
        buildNoStart: inputs.build_num
        buildNoEnd: inputs.build_num
        status: inputs.build_status
        page:
          value: 1
        pageSize:
          value: 1
      reads:
      - data.hasDownloadPermission
      - data.records[0].status
  - name: check-build
    description: 查构建状态，RUNNING、QUEUE 时轮询等待。SUCCEED 继续；REVIEWING 表示在等人工审核，告诉用户后停止；FAILED、CANCELED 等不生成下载地址，报告 `errorInfoList`；到达次数上限仍在进行中时返回当前状态。没给 `build_num` 也没给 `build_status`、而最近一次构建没有成功时，用户多半想要能用的包：说明这次构建的状态，并问是否改取最近一次成功的构建，同意后 `build_status` 传 `["SUCCEED"]` 从第 1 步重新开始。
    calls:
    - gateway: devops
      stage: prod
      resource: v4_user_build_status
      params:
        projectId: inputs.project_id
        pipelineId: inputs.pipeline_id
        buildId: locate-build.v4_user_build_list.data.records[0].id
      poll:
        interval: 30
        max: 10
        until: data.status not in ["RUNNING", "QUEUE"]
        stop_when:
        - status != 0
      reads:
      - data.errorInfoList[].atomCode
      - data.errorInfoList[].errorMsg
  - name: fetch-artifacts
    description: 先列出产物，再给每个可下载的文件生成下载地址。IMAGE、REPORT 类产物和文件夹不能生成下载地址，列在回复里并说明原因。`path` 原样传递，不要自己做 URL 编码。
    calls:
    - gateway: devops
      stage: prod
      resource: v4_user_artifactory_list
      params:
        projectId: inputs.project_id
        pipelineId: inputs.pipeline_id
        buildId: locate-build.v4_user_build_list.data.records[0].id
    - gateway: devops
      stage: prod
      resource: user_artifactory_thirdPartyDownloadUrl
      for_each:
        from: fetch-artifacts.v4_user_artifactory_list.data.records
        where: '`folder` 为 false，且 `artifactoryType` 为 PIPELINE 或 CUSTOM_DIR'
      params:
        projectId: inputs.project_id
        artifactoryType: each.artifactoryType
        path: each.fullPath
        ttl: inputs.ttl
  guide:
    not_for: |-
      - 启动或重试流水线构建：本 Skill 只读构建和产物，不调用 build_start。
      - 用应用身份只看构建详情、不要下载链接：用「查看流水线构建历史和详情」。
      - 分析构建失败的详细原因、查看插件日志：用「流水线构建记录查询」。
      - 镜像（IMAGE）和报告（REPORT）类产物：下载接口不支持。
    constraints: |-
      - 四个接口都不修改构建和产物，不需要向用户确认。生成的下载地址不需要权限即可下载，等同分享链接：只回复给提出请求的用户，不要发到群聊或写进文档。
      - `ttl` 默认 3600 秒，比接口默认的 1 天短：链接外泄后谁都能下载，有效期越短风险越小。用户明确要求时再加长。
      - 产物超过 20 个时，先列出清单请用户选择，再生成下载地址，避免一次生成一大批免鉴权链接。
    errors: |-
      - `status` 不为 0：把 `message` 告诉用户并停止。
      - 查不到构建（`data.records` 为空）：确认项目 ID、流水线 ID 和构建号是否正确。
      - 构建状态为 FAILED、CANCELED 等：列出 `errorInfoList` 中的 `atomCode` 和 `errorMsg`，不生成下载地址。
      - 用户认证失败（401 或提示未登录）：请用户重新登录后再试。
      - 产物列表为空：说明这次构建没有归档产物。
    example: |-
      用户：把 my-game 项目流水线 p-4b3a…05b4 最新构建的包给我。

      1. v4_user_build_list（page 1，pageSize 1）→ `records[0].id = b-2c97…0d29`，`buildNum = 128`，`hasDownloadPermission = true`。
      2. v4_user_build_status → `data.status = SUCCEED`。
      3. v4_user_artifactory_list → 2 条记录：`app.apk`（PIPELINE，52 MB）和 `symbols/`（文件夹，跳过）。
      4. user_artifactory_thirdPartyDownloadUrl（artifactoryType PIPELINE，path `/p-4b3a…/b-2c97…/app.apk`，ttl 3600）→ 1 个下载地址。
      5. 回复：构建 #128 成功，`app.apk`（52 MB）下载地址如下，1 小时内有效。
